name: Agent review request and retry

on:
  pull_request_target:
    branches: [main]
    types: [opened, ready_for_review, reopened, synchronize]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: write

jobs:
  request-agent-review:
    runs-on: ubuntu-latest
    steps:
      - name: Request or re-request the configured GitHub agent reviewer
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if test -n "${EVENT_PR}"; then
            pr_numbers="${EVENT_PR}"
          else
            pr_numbers="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number --jq '.[].number')"
          fi
          review_strategies='qwen3-14b-grounded-seed42-v8,qwen3-14b-grounded-seed7-v8'
          gh api \
            "repos/${GITHUB_REPOSITORY}/contents/.github/scripts/plan-agent-review-retry.mjs?ref=main" \
            --jq '.content' | base64 --decode > plan-agent-review-retry.mjs
          for pr_number in $pr_numbers; do
            head_sha="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')"
            reviewed="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/reviews" \
              | jq -s -r --arg head "$head_sha" \
                'add | any(.[]; .user.login == "copilot-pull-request-reviewer[bot]" and .commit_id == $head)')"
            if test "$reviewed" != true; then
              if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/requested_reviewers" \
                --input - <<< '{"reviewers":["copilot-pull-request-reviewer[bot]"]}'; then
                echo "Copilot review request unavailable; GitHub-hosted pinned local-model fallback remains authoritative"
              fi
            fi
            if test -n "${EVENT_PR}"; then
              echo "Direct pull-request event already launches the fallback; skipping duplicate dispatch"
              continue
            fi
            gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${head_sha}/check-runs?check_name=agent-review&filter=all" \
              --jq '.check_runs' > agent-review-checks.json
            plan="$(node plan-agent-review-retry.mjs agent-review-checks.json \
              "$pr_number" "$head_sha" "$review_strategies")"
            echo "Review retry plan: $plan"
            if test "$(jq -r '.action' <<<"$plan")" = 'dispatch'; then
              strategy="$(jq -r '.strategy' <<<"$plan")"
              gh workflow run agent-review.yml --repo "$GITHUB_REPOSITORY" --ref main \
                -f pr_number="$pr_number" -f head_sha="$head_sha" -f review_strategy="$strategy"
            fi
          done
