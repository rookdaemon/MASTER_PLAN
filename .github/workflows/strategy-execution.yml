name: Strategy packet execution

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  checks: write
  contents: write
  pull-requests: write

concurrency:
  group: strategy-packet-execution
  cancel-in-progress: false

jobs:
  execute-packet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Execute and publish the selected bounded packet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cycle_time="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          execution_json="$(npm run --silent strategy:execute -- "$cycle_time")"
          status="$(jq -er '.status' <<<"$execution_json")"
          if test "$status" = waiting || test "$status" = already-executed; then
            echo "No new bounded packet execution is currently available"
            exit 0
          fi
          test "$status" = executed
          packet_id="$(jq -er '.packetId' <<<"$execution_json")"
          artifact_path="$(jq -er '.artifactPath' <<<"$execution_json")"
          result_path="$(jq -er '.resultPath' <<<"$execution_json")"
          case "$artifact_path" in strategy/results/*.json) ;; *) exit 1 ;; esac
          case "$result_path" in strategy/results/*.result.json) ;; *) exit 1 ;; esac
          test "$artifact_path" != "$result_path"
          changed_paths="$(git diff --name-only | sort)"
          expected_paths="$(printf '%s\n%s\n' "$artifact_path" "$result_path" | sort)"
          test "$changed_paths" = "$expected_paths"

          git fetch origin main
          base_sha="$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD)" = "$base_sha"
          branch="agent/strategy-execution-${GITHUB_RUN_ID}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$branch"
          git add -- "$artifact_path" "$result_path"
          git commit -m "Execute bounded strategy packet ${packet_id}"
          head_sha="$(git rev-parse HEAD)"
          commit_count="$(git rev-list --count origin/main..HEAD)"
          test "$commit_count" -eq 1
          npm run lint
          npm test
          npm run strategy:verify
          BASE_SHA="$base_sha" HEAD_SHA="$head_sha" PR_COMMIT_COUNT="$commit_count" npm run governance:classify
          git push --set-upstream origin "$branch"
          pr_url="$(gh pr create --base main --head "$branch" \
            --title "Execute bounded strategy packet ${packet_id}" \
            --body "Automated deterministic packet execution at ${cycle_time}. strategy-execution:packet:${packet_id}:result:${result_path}. The result remains unintegrated until exact-head independent agent review succeeds.")"
          pr_number="$(gh pr view "$pr_url" --json number --jq '.number')"
          for check_name in typecheck test strategy-verify proposal-review safe-auto-merge; do
            gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
              -f name="$check_name" -f head_sha="$head_sha" \
              -f status=completed -f conclusion=success \
              -f external_id="strategy-execution:run:${GITHUB_RUN_ID}:head:${head_sha}:check:${check_name}" \
              -f details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              >/dev/null
          done
          gh workflow run agent-review.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f pr_number="$pr_number" -f head_sha="$head_sha"
          gh pr merge "$pr_url" --auto --squash
