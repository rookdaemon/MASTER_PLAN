name: Safe code auto-merge

on:
  pull_request:
    branches: [main]
    types: [opened, ready_for_review, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  safe-auto-merge:
    if: vars.MASTER_PLAN_SAFE_AUTOMERGE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Classify proposal policy
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_COMMIT_COUNT: ${{ github.event.pull_request.commits }}
        run: |
          npm run governance:classify > classification.json
          echo "merge_mode=$(jq -r '.proposalPolicy.mergeMode' classification.json)" >> "$GITHUB_OUTPUT"
      - if: steps.classify.outputs.merge_mode == 'automatic'
        run: npm run lint
      - if: steps.classify.outputs.merge_mode == 'automatic'
        run: npm test
      - if: steps.classify.outputs.merge_mode == 'automatic'
        run: npm run strategy:verify
