name: Strategy reviewed-result integration

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string

permissions:
  actions: write
  checks: write
  contents: write
  pull-requests: write

concurrency:
  group: strategy-reviewed-integration-${{ inputs.pr_number }}-${{ inputs.head_sha }}
  cancel-in-progress: false

jobs:
  discover-reviewed-results:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Redispatch merged execution results for idempotent integration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list --repo "$GITHUB_REPOSITORY" --state merged --limit 100 \
            --json number,body,headRefOid \
            --jq '.[] | select((.body // "") | contains("strategy-execution:packet:")) | [.number, .headRefOid] | @tsv' \
            | while IFS=$'\t' read -r pr_number head_sha; do
                gh workflow run strategy-integrate-reviewed.yml --repo "$GITHUB_REPOSITORY" --ref main \
                  -f pr_number="$pr_number" -f head_sha="$head_sha"
              done
  integrate-reviewed-result:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Bind the execution marker and exact agent review
        id: attestation
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          test "$(jq -r '.head.sha' <<<"$pr_json")" = "$HEAD_SHA"
          body="$(jq -r '.body // ""' <<<"$pr_json")"
          marker="$(grep -oE 'strategy-execution:packet:[A-Za-z0-9._-]+:result:strategy/results/[A-Za-z0-9._/-]+\.result\.json' <<<"$body" || true)"
          if test -z "$marker"; then
            echo "reviewed_execution=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$(wc -l <<<"$marker")" -eq 1
          packet_id="$(sed -nE 's#^strategy-execution:packet:([A-Za-z0-9._-]+):result:.*$#\1#p' <<<"$marker")"
          result_path="$(sed -nE 's#^strategy-execution:packet:[A-Za-z0-9._-]+:result:(strategy/results/[A-Za-z0-9._/-]+\.result\.json)$#\1#p' <<<"$marker")"
          test -n "$packet_id"
          test -n "$result_path"

          for attempt in $(seq 1 60); do
            pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
            test "$(jq -r '.head.sha' <<<"$pr_json")" = "$HEAD_SHA"
            if test "$(jq -r '.merged' <<<"$pr_json")" = true; then break; fi
            test "$attempt" -lt 60
            sleep 10
          done
          merge_commit_sha="$(jq -er '.merge_commit_sha' <<<"$pr_json")"
          checks_json="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100" | jq -s '[.[].check_runs[]]')"
          agent_check="$(jq -ec '
            [.[] | select(.name == "agent-review" and .conclusion == "success")]
            | max_by(.completed_at)
          ' <<<"$checks_json")"
          agent_external_id="$(jq -r '.external_id' <<<"$agent_check")"
          review_run_id="$(sed -nE 's#^agent-review:pr:[0-9]+:head:[0-9a-f]+:run:([0-9]+)$#\1#p' <<<"$agent_external_id")"
          test -n "$review_run_id"
          test "$agent_external_id" = "agent-review:pr:${PR_NUMBER}:head:${HEAD_SHA}:run:${review_run_id}"
          agent_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${review_run_id}")"
          test "$(jq -r '.path' <<<"$agent_run")" = '.github/workflows/agent-review.yml'
          test "$(jq -r '.display_title' <<<"$agent_run")" = "Agent review PR #${PR_NUMBER} @ ${HEAD_SHA}"
          reviewed_at="$(jq -er '.completed_at' <<<"$agent_check")"
          echo "reviewed_execution=true" >> "$GITHUB_OUTPUT"
          echo "packet_id=$packet_id" >> "$GITHUB_OUTPUT"
          echo "result_path=$result_path" >> "$GITHUB_OUTPUT"
          echo "merge_commit_sha=$merge_commit_sha" >> "$GITHUB_OUTPUT"
          echo "review_run_id=$review_run_id" >> "$GITHUB_OUTPUT"
          echo "reviewed_at=$reviewed_at" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.attestation.outputs.reviewed_execution == 'true'
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        if: steps.attestation.outputs.reviewed_execution == 'true'
        with:
          node-version: 24
          cache: npm
      - if: steps.attestation.outputs.reviewed_execution == 'true'
        run: npm ci
      - name: Integrate the reviewed result and publish one bounded commit
        if: steps.attestation.outputs.reviewed_execution == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PACKET_ID: ${{ steps.attestation.outputs.packet_id }}
          RESULT_PATH: ${{ steps.attestation.outputs.result_path }}
          MERGE_COMMIT_SHA: ${{ steps.attestation.outputs.merge_commit_sha }}
          REVIEW_RUN_ID: ${{ steps.attestation.outputs.review_run_id }}
          REVIEWED_AT: ${{ steps.attestation.outputs.reviewed_at }}
        run: |
          set -euo pipefail
          git fetch origin main
          base_sha="$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD)" = "$base_sha"
          git merge-base --is-ancestor "$MERGE_COMMIT_SHA" origin/main
          test -f "$RESULT_PATH"
          lifecycle="$(jq -er --arg packet "$PACKET_ID" '.[] | select(.id == $packet) | .lifecycle' strategy/work-packets.json)"
          if test "$lifecycle" = verified; then
            echo "Reviewed execution is already integrated"
            exit 0
          fi
          test "$lifecycle" = eligible || test "$lifecycle" = active
          integration_time="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          npm run strategy:integrate-reviewed-execution -- \
            "$PACKET_ID" "$RESULT_PATH" github-hosted-agent-review "$REVIEW_RUN_ID" \
            "$HEAD_SHA" "$REVIEWED_AT" "$integration_time"
          test -n "$(git diff --name-only)"
          while IFS= read -r path; do
            case "$path" in
              "$RESULT_PATH"|strategy/graph.json|strategy/evidence.json|strategy/assessments.json|strategy/work-packets.json|strategy/audit-log.json|strategy/portfolio.json|strategy/governance.json|strategy/ROADMAP.md|STATUS.md) ;;
              *) echo "Unexpected integration path: $path"; exit 1 ;;
            esac
          done < <(git diff --name-only)

          branch="agent/strategy-integration-${GITHUB_RUN_ID}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$branch"
          git add -- "$RESULT_PATH" strategy/graph.json strategy/evidence.json strategy/assessments.json \
            strategy/work-packets.json strategy/audit-log.json strategy/portfolio.json \
            strategy/governance.json strategy/ROADMAP.md STATUS.md
          git commit -m "Integrate reviewed strategy result ${PACKET_ID}"
          head_sha="$(git rev-parse HEAD)"
          commit_count="$(git rev-list --count origin/main..HEAD)"
          test "$commit_count" -eq 1
          npm run lint
          npm test
          npm run strategy:verify
          BASE_SHA="$base_sha" HEAD_SHA="$head_sha" PR_COMMIT_COUNT="$commit_count" npm run governance:classify
          git push --set-upstream origin "$branch"
          pr_url="$(gh pr create --base main --head "$branch" \
            --title "Integrate reviewed strategy result ${PACKET_ID}" \
            --body "Automated controller-semantic integration of ${PACKET_ID} after exact-head agent review run ${REVIEW_RUN_ID}. Source execution head: ${HEAD_SHA}.")"
          pr_number="$(gh pr view "$pr_url" --json number --jq '.number')"
          for check_name in typecheck test strategy-verify proposal-review safe-auto-merge; do
            gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
              -f name="$check_name" -f head_sha="$head_sha" \
              -f status=completed -f conclusion=success \
              -f external_id="strategy-integration:run:${GITHUB_RUN_ID}:head:${head_sha}:check:${check_name}" \
              -f details_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              >/dev/null
          done
          gh workflow run agent-review.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f pr_number="$pr_number" -f head_sha="$head_sha"
          gh pr merge "$pr_url" --auto --squash
